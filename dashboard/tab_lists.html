<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Barlow+Condensed:wght@300;400;600;700;800;900&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Norwester';src:url('css/norwester.otf') format('opentype')}
:root{--bg:#1a1a1a;--bg2:#242424;--bg3:#2a2a2a;--bg4:#323232;--bg5:#2e2e2e;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.05);--C:#9f00fa;--C2:rgba(159,0,250,0.12);--Ch:#7a00c0;--Cl:#d36eff;--O:#ff6a1a;--G:#72d648;--R:#ff4040;--Y:#ffb020;--P:#d36eff;--t:#ffffff;--tm:#e0e0e0;--td:#c8c8c8;--dim:#888888;--bdr:#000;--bdr2:#282828;--mono:'JetBrains Mono',monospace;--cond:'Barlow Condensed',sans-serif;--jost:'Jost',sans-serif;--nw:'Norwester','Jost',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t);font-family:var(--mono);display:flex;flex-direction:column}

.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:200px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line2);overflow-y:auto;padding:8px 0}
.grp-label{font-size:13px;color:var(--td);letter-spacing:.15em;text-transform:uppercase;padding:10px 12px 4px;font-family:var(--jost)}
.file-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 12px;background:transparent;border:none;cursor:pointer;text-align:left;color:var(--tm);font-family:var(--jost);font-size:13px;transition:background .15s,color .15s;border-left:2px solid transparent}
.file-btn:hover{background:var(--bg3);color:var(--t)}
.file-btn.on{background:var(--bg3);color:var(--C);border-left-color:var(--C)}
.fname{flex:1;line-height:1.4}
.fcount{font-size:12px;color:var(--td);background:var(--bg3);padding:1px 6px;flex-shrink:0;margin-left:4px}
.file-btn.on .fcount{color:var(--C)}

/* MAIN */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line2);background:var(--bg3);flex-shrink:0;flex-wrap:wrap}
.tbl-title{font-family:var(--cond);font-size:19px;font-weight:700;color:var(--t);text-transform:uppercase;letter-spacing:.04em}
.tbl-meta{font-size:13px;color:var(--tm)}
.badge-vip{background:rgba(255,224,51,.15);color:var(--Y);border:1px solid rgba(255,224,51,.3);font-size:13px;padding:2px 7px;letter-spacing:.1em}
.badge-bl{background:rgba(255,45,85,.12);color:var(--R);border:1px solid rgba(255,45,85,.25);font-size:13px;padding:2px 7px;letter-spacing:.1em}
.badge-ppl{background:rgba(0,229,160,.12);color:var(--G);border:1px solid rgba(0,229,160,.3);font-size:13px;padding:2px 7px;letter-spacing:.1em}
.search-wrap{margin-left:auto;position:relative}
.search-input{background:var(--bg2);border:1px solid var(--line2);color:var(--t);font-family:var(--mono);font-size:13px;padding:6px 10px 6px 26px;width:200px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--C)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--td);font-size:15px}
.row-count{font-size:13px;color:var(--td);white-space:nowrap}

/* TABLE */
.table-wrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--bg3);color:var(--td);letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--line2);text-align:left;font-weight:400;white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none;transition:color .15s}
thead th:hover{color:var(--C)}
thead th.sort-asc::after{content:' ↑';color:var(--C)}
thead th.sort-desc::after{content:' ↓';color:var(--C)}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--tm);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover td{background:var(--bg3);color:var(--t)}

/* STATUS COLORS for sales people */
.s-active{color:var(--G)}
.s-gone{color:var(--R)}
.s-inactive{color:var(--td)}
.s-owner{color:var(--Y)}
.s-admin{color:var(--P)}
.s-semi{color:var(--O)}
.num{color:var(--C);font-variant-numeric:tabular-nums}
.warn{color:var(--Y)}

/* JS-generated element classes (extracted from inline styles) */
.err-wrap{display:flex;align-items:center;justify-content:center;height:200px;flex-direction:column;gap:8px}
.err-icon{font-size:20px}
.err-msg{color:var(--td);font-size:12px;letter-spacing:.1em}
.err-sidebar{padding:12px;font-size:11px;color:var(--R);line-height:1.8}
.dim-dash{color:#6878a8}
.truncation-msg{text-align:center;color:#6878a8;padding:12px}
.section-count{color:#6878a8}
.phone-tbd{color:var(--Y)}
.stale-high{color:var(--R)}.stale-mid{color:var(--O)}.stale-low{color:var(--G)}
.p-paid{font-size:13px;color:var(--tm);margin-top:2px}
.p-notes{font-size:13px;color:var(--td);margin-top:6px;line-height:1.5}
.content-hidden{overflow:hidden}
.content-scroll{overflow:auto}
.content-area{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tbl-meta-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.empty-prompt{display:flex;align-items:center;justify-content:center;height:100%;color:#6878a8;font-size:15px;letter-spacing:.1em}

/* SECTION CARDS for people view */
.people-wrap{padding:20px;overflow-y:auto;flex:1;font-family:var(--jost)}
.section-hdr{font-family:var(--cond);font-size:16px;font-weight:700;color:var(--td);letter-spacing:.2em;text-transform:uppercase;padding:12px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:20px}
.person-card{background:var(--bg2);border:1px solid var(--line);padding:12px;transition:border-color .15s;position:relative;font-family:var(--jost)}
.person-card:hover{border-color:rgba(255,255,255,0.25)}
.person-card.active{border-left:3px solid var(--G)}
.person-card.gone{border-left:3px solid var(--R)}
.person-card.owner{border-left:3px solid var(--Y)}
.person-card.semi{border-left:3px solid var(--O)}
.person-card.inactive{border-left:3px solid var(--td)}
.p-name{font-family:var(--cond);font-size:19px;font-weight:700;color:var(--t);margin-bottom:2px}
.p-role{font-size:13px;color:var(--td);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.p-phone{font-size:15px;color:var(--C);margin-bottom:2px}
.p-email{font-size:13px;color:var(--tm);margin-bottom:6px}
.p-stale{font-family:var(--cond);font-size:21px;font-weight:700}
.p-stale-lbl{font-size:13px;color:var(--td)}
.p-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 6px;letter-spacing:.06em;font-family:var(--mono)}
.tag.transfer{background:rgba(0,229,255,.1);color:var(--C);border:1px solid rgba(0,229,255,.2)}
.tag.gone{background:rgba(255,45,85,.1);color:var(--R);border:1px solid rgba(255,45,85,.2)}
.tag.hs{background:rgba(0,229,160,.1);color:var(--G);border:1px solid rgba(0,229,160,.2)}
.tag.no-hs{background:rgba(255,107,43,.1);color:var(--O);border:1px solid rgba(255,107,43,.2)}
.tag.oq{background:rgba(255,224,51,.1);color:var(--Y);border:1px solid rgba(255,224,51,.2)}
.p-priority{position:absolute;top:10px;right:10px;font-family:var(--cond);font-size:29px;font-weight:900;color:rgba(255,255,255,0.1);line-height:1}

@media(max-width:768px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;max-height:35vh;border-right:none;border-bottom:1px solid var(--line2);}
  .toolbar{flex-wrap:wrap;padding:8px 12px;gap:8px;}
  .search-wrap{margin-left:0;width:100%;}
  .search-input{width:100%;}
  .people-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;}
  .people-wrap{padding:14px;}
  table{font-size:11px;}
  thead th,tbody td{padding:6px 8px;}
}
@media(max-width:480px){
  .sidebar{max-height:30vh;}
  .people-grid{grid-template-columns:1fr;}
  .tbl-title{font-size:16px;}
}
</style>
<link rel="stylesheet" href="css/avatars.css">
<script defer src="js/env.js"></script>
<script defer src="js/avatars.js"></script>
<script defer src="data/csv_data.js"></script>
<script defer src="js/lists.js"></script>
<script defer src="js/proplink.js"></script>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="toolbar">
      <div>
        <div class="tbl-title" id="tbl-title">Select a list</div>
        <div class="tbl-meta-row">
          <div class="tbl-meta" id="tbl-meta"></div>
          <span id="tbl-badge"></span>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" type="text" id="searchInput" placeholder="Search..." oninput="onSearch()">
      </div>
      <div class="row-count" id="rowCount"></div>
    </div>
    <div id="content-area" class="content-area">
      <div class="empty-prompt">← Select a list from the sidebar</div>
    </div>
  </div>
</div>

</body>
</html>
