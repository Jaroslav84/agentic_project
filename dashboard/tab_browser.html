<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Barlow+Condensed:wght@300;400;600;700;800;900&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Norwester';src:url('css/norwester.otf') format('opentype')}
:root{--bg:#1a1a1a;--bg2:#242424;--bg3:#2a2a2a;--bg4:#323232;--bg5:#2e2e2e;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.05);--C:#9f00fa;--C2:rgba(159,0,250,0.12);--Ch:#7a00c0;--Cl:#d36eff;--O:#ff6a1a;--G:#72d648;--R:#ff4040;--Y:#ffb020;--P:#d36eff;--t:#ffffff;--tm:#e0e0e0;--td:#c8c8c8;--dim:#888888;--bdr:#000;--bdr2:#282828;--mono:'JetBrains Mono',monospace;--cond:'Barlow Condensed',sans-serif;--jost:'Jost',sans-serif;--nw:'Norwester','Jost',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t);font-family:var(--mono);display:flex;flex-direction:column}

/* BROWSER LAYOUT */
.browser{display:flex;flex:1;overflow:hidden}

/* LEFT SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line2);overflow-y:auto;padding:12px 0}
.grp-label{font-size:11px;color:var(--td);letter-spacing:.2em;text-transform:uppercase;padding:10px 14px 4px}
.file-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 14px;background:transparent;border:none;cursor:pointer;text-align:left;color:var(--tm);font-family:var(--mono);font-size:12px;transition:background .15s,color .15s;border-left:2px solid transparent}
.file-btn:hover{background:var(--bg3);color:var(--t)}
.file-btn.on{background:var(--bg3);color:var(--C);border-left-color:var(--C)}
.file-btn .fname{flex:1;line-height:1.4}
.file-btn .fcount{font-size:11px;color:var(--td);background:var(--bg);padding:1px 5px;border-radius:2px;flex-shrink:0;margin-left:4px}
.file-btn.on .fcount{color:var(--C)}

/* MAIN CONTENT */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line2);background:var(--bg3);flex-shrink:0}
.tbl-title{font-family:var(--cond);font-size:19px;font-weight:700;color:var(--t);text-transform:uppercase;letter-spacing:.04em}
.tbl-meta{font-size:12px;color:var(--tm)}
.search-wrap{margin-left:auto;position:relative}
.search-input{background:var(--bg2);border:1px solid var(--line2);color:var(--t);font-family:var(--mono);font-size:12px;padding:6px 10px 6px 28px;width:220px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--C)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--td);font-size:13px}
.row-count{font-size:11px;color:var(--td);white-space:nowrap}

/* TABLE WRAP */
.table-wrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg3);color:var(--td);letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--line2);text-align:left;font-weight:400;white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none;transition:color .15s}
thead th:hover{color:var(--tm)}
thead th.sort-asc::after{content:' ↑';color:var(--C)}
thead th.sort-desc::after{content:' ↓';color:var(--C)}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--tm);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover td{background:var(--bg3);color:var(--t)}

/* VALUE COLORING */
td.num{color:var(--C);font-variant-numeric:tabular-nums}
td.date-col{color:var(--tm)}
td.date-col{color:var(--tm)}
td.vip{color:var(--Y)}
td.blacklist{color:var(--R)}
td.gone{color:var(--R)}
td.active{color:var(--G)}

/* EMPTY STATE */
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--td);font-size:15px;letter-spacing:.1em}

/* JS-generated element classes (extracted from inline styles) */
.err-wrap{display:flex;align-items:center;justify-content:center;height:200px;flex-direction:column;gap:8px}
.err-icon{font-size:20px}
.err-msg{color:var(--td);font-size:12px;letter-spacing:.1em}
.err-sidebar{padding:14px;font-size:11px;color:var(--R);line-height:1.8}
.dim-dash{color:#6878a8}
.truncation-msg{text-align:center;color:#6878a8;padding:12px}
.prop-link{color:var(--C);text-decoration:none}
.rel-today{color:var(--G)}.rel-week{color:var(--C)}.rel-month{color:var(--Y)}.rel-old{color:var(--R)}.rel-default{color:var(--td)}

@media(max-width:768px){
  .browser{flex-direction:column;}
  .sidebar{width:100%;max-height:35vh;border-right:none;border-bottom:1px solid var(--line2);}
  .toolbar{flex-wrap:wrap;padding:8px 12px;gap:8px;}
  .search-wrap{margin-left:0;width:100%;}
  .search-input{width:100%;}
  table{font-size:11px;}
  thead th,tbody td{padding:6px 8px;}
}
@media(max-width:480px){
  .sidebar{max-height:30vh;}
  .tbl-title{font-size:16px;}
  .empty{font-size:13px;}
}
</style>
<script defer src="js/env.js"></script>
<script defer src="data/csv_data.js"></script>
<script defer src="js/browser.js"></script>
<script defer src="js/proplink.js"></script>
</head>
<body>
<div class="browser">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- MAIN -->
  <div class="main">
    <div class="toolbar">
      <div>
        <div class="tbl-title" id="tbl-title">Select a file</div>
        <div class="tbl-meta" id="tbl-meta"></div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" type="text" id="searchInput" placeholder="Search all columns..." oninput="filterTable()">
      </div>
      <div class="row-count" id="rowCount"></div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <div class="empty">← Select a dataset from the sidebar</div>
    </div>
  </div>
</div>

</body>
</html>
