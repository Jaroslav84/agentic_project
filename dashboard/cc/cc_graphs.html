<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/subtabs.css">
<style>
:root{
  --bg:#1a1a1a;--bg2:#242424;
  --C:#9f00fa;--Cl:#d36eff;
  --dim:#888888;--t:#ffffff;--tm:#e0e0e0;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:var(--mono)}
.shell{display:flex;flex-direction:column;height:100%}
.gframes{flex:1;position:relative;overflow:hidden}
.gf{position:absolute;inset:0;border:none;width:100%;height:100%;display:none;background:var(--bg)}
.gf.on{display:block}
</style>
<script defer src="../js/env.js"></script>
<script defer src="../js/graphs.js"></script>
</head>
<body>
<div class="shell">

<div class="subtabs">
  <button class="stb on" onclick="showG('arch',this)">Node</button>
  <button class="stb" onclick="showG('network',this)">Network</button>
  <button class="stb" onclick="showG('pipecat',this)">Pipecat</button>
  <button class="stb" onclick="showG('ttsstt',this)">TTS / STT</button>
  <button class="stb" onclick="showG('state',this)">State Flow</button>
  <button class="stb" onclick="showG('callflow',this)">Call Flow</button>
  <button class="stb" onclick="showG('sequence',this)">Sequence</button>
  <button class="stb" onclick="showG('scriptsel',this)">Script Select</button>
  <button class="stb" onclick="showG('transfer',this)">Transfer</button>
</div>

<div class="gframes">
  <iframe class="gf on" id="gf-arch"      src="../tab_nodes.html" allow="fullscreen"></iframe>
  <iframe class="gf"    id="gf-network"   data-src="../architecture/arch_network.html" allow="fullscreen"></iframe>
  <iframe class="gf"    id="gf-pipecat"   data-src="../architecture/arch_pipecat.html" allow="fullscreen"></iframe>
  <iframe class="gf"    id="gf-ttsstt"   data-src="../architecture/arch_tts_stt.html" allow="fullscreen"></iframe>
  <iframe class="gf"    id="gf-state"     data-src="../architecture/arch_stateflow.html" allow="fullscreen"></iframe>
  <iframe class="gf"    id="gf-callflow"  data-src="../architecture/arch_callflow.html" allow="fullscreen"></iframe>
  <iframe class="gf"    id="gf-sequence"  data-src="../architecture/arch_sequence.html" allow="fullscreen"></iframe>
  <iframe class="gf"    id="gf-scriptsel" data-src="../architecture/arch_scriptselect.html" allow="fullscreen"></iframe>
  <iframe class="gf"    id="gf-transfer"  data-src="../architecture/arch_transfer.html" allow="fullscreen"></iframe>
</div>

</div>
</body>
</html>
